                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pilot</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1e1e1e; color: #eee;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  #tabs {
    display: flex; align-items: center;
    background: #2a2a2a; padding: 4px 4px 0 4px;
    overflow-x: auto;
  }
  .tab {
    display: flex; align-items: center; gap: 6px;
    background: #1e1e1e; color: #ccc;
    padding: 6px 10px; margin-right: 2px;
    border-radius: 6px 6px 0 0;
    cursor: pointer; user-select: none;
    max-width: 200px; min-width: 120px;
    font-size: 13px;
  }
  .tab.active { background: #3a3a3a; color: #fff; }
  .tab .title {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  .tab .close {
    background: transparent; color: #aaa; border: none;
    cursor: pointer; font-size: 14px; padding: 0 2px;
  }
  .tab .close:hover { color: #fff; }
  #newTab {
    background: transparent; color: #aaa; border: none;
    cursor: pointer; font-size: 18px; padding: 4px 10px;
  }
  #newTab:hover { color: #fff; }

  #toolbar {
    display: flex; align-items: center; gap: 6px;
    background: #3a3a3a; padding: 6px 8px;
  }
  #toolbar button {
    background: #4a4a4a; color: #fff; border: none;
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
    font-size: 14px;
  }
  #toolbar button:hover { background: #5a5a5a; }
  #toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #addressBar {
    flex: 1; padding: 6px 10px; border-radius: 4px;
    border: 1px solid #555; background: #1e1e1e; color: #fff;
    font-size: 14px; outline: none;
  }
  #addressBar:focus { border-color: #4a90e2; }

  #bookmarks {
    display: flex; align-items: center; gap: 4px;
    background: #2a2a2a; padding: 4px 8px;
    overflow-x: auto; font-size: 12px;
  }
  #bookmarks button {
    background: transparent; color: #8ab4f8; border: none;
    cursor: pointer; padding: 3px 6px; border-radius: 3px;
    white-space: nowrap;
  }
  #bookmarks button:hover { background: #3a3a3a; }
  #bookmarks .add {
    color: #aaa; font-size: 14px; margin-left: auto;
  }

  #viewWrap { flex: 1; position: relative; background: #fff; }
  #view { width: 100%; height: 100%; border: none; background: #fff; display: block; }
  #blocked {
    display: none; position: absolute; inset: 0;
    background: #1e1e1e; color: #eee;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; gap: 12px;
  }
  #blocked h2 { margin: 0; color: #8ab4f8; }
  #blocked p  { margin: 0; color: #aaa; max-width: 480px; }
  #blocked button {
    background: #4a90e2; color: #fff; border: none;
    padding: 10px 20px; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  #blocked button:hover { background: #5aa0f2; }
  #blocked .secondary {
    background: transparent; color: #aaa; border: 1px solid #555;
  }
  #blocked .secondary:hover { background: #2a2a2a; color: #fff; }

  #status {
    background: #2a2a2a; color: #aaa; font-size: 12px;
    padding: 3px 8px; border-top: 1px solid #1a1a1a;
  }
</style>
</head>
<body>
<div id="app">
  <div id="tabs">
    <button id="newTab" title="New tab">+</button>
  </div>

  <div id="toolbar">
    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reload" title="Reload">⟳</button>
    <button id="home" title="Home">🏠</button>
    <button id="openExternal" title="Open in new tab">↗ Open</button>
    <input id="addressBar" type="text" placeholder="Search or enter URL" />
  </div>

  <div id="bookmarks">
    <button data-url="https://en.wikipedia.org">Wikipedia</button>
    <button data-url="https://example.com">Example</button>
    <button data-url="https://news.ycombinator.com">Hacker News</button>
    <button data-url="https://duckduckgo.com">DuckDuckGo</button>
    <button class="add" id="bookmarkPage" title="Bookmark current page">★ Bookmark</button>
  </div>

  <div id="viewWrap">
    <iframe id="view" sandbox="allow-scripts allow-forms allow-popups allow-same-origin"></iframe>
    <div id="blocked">
      <h2>This site can't be embedded</h2>
      <p>The website refuses to load inside Pilot (it blocks iframe embedding for security). You can open it in your real browser instead.</p>
      <button id="openBlocked">Open in new tab</button>
      <button class="secondary" id="backFromBlocked">← Go back</button>
    </div>
  </div>
  <div id="status">Pilot ready</div>
</div>

<script>
  const HOME = "https://example.com";
  const SEARCH = "https://duckduckgo.com/?q=";
  const $ = (id) => document.getElementById(id);

  const state = {
    tabs: [],
    activeId: null,
    nextId: 1,
    history: {},
    loadTimer: null,
  };

  function normalizeUrl(input) {
    let url = input.trim();
    if (!url) return HOME;
    if (!/^https?:\/\//i.test(url)) {
      if (/^[\w-]+\.[\w.-]+/.test(url)) {
        url = "https://" + url;
      } else {
        url = SEARCH + encodeURIComponent(url);
      }
    }
    return url;
  }

  function createTab(url = HOME) {
    const id = state.nextId++;
    state.tabs.push({ id, url, title: "New Tab" });
    state.history[id] = { back: [], forward: [] };
    renderTabs();
    setActive(id);
    navigate(url, false);
  }

  function closeTab(id) {
    const idx = state.tabs.findIndex(t => t.id === id);
    if (idx === -1) return;
    state.tabs.splice(idx, 1);
    delete state.history[id];
    if (state.activeId === id) {
      const next = state.tabs[idx] || state.tabs[idx - 1];
      state.activeId = next ? next.id : null;
    }
    if (state.tabs.length === 0) { createTab(); return; }
    renderTabs();
    if (state.activeId) loadActive();
  }

  function setActive(id) {
    state.activeId = id;
    renderTabs();
    loadActive();
  }

  function activeTab() {
    return state.tabs.find(t => t.id === state.activeId);
  }

  function showBlocked() { $("blocked").style.display = "flex"; }
  function hideBlocked() { $("blocked").style.display = "none"; }

  function navigate(input, pushHistory = true) {
    const tab = activeTab();
    if (!tab) return;
    const url = normalizeUrl(input);
    if (pushHistory) {
      state.history[tab.id].back.push(tab.url);
      state.history[tab.id].forward = [];
    }
    tab.url = url;
    hideBlocked();
    armLoadTimer();
    $("view").src = url;
    $("addressBar").value = url;
    setStatus("Pilot loading " + url + " …");
    renderTabs();
  }

  function armLoadTimer() {
    clearTimeout(state.loadTimer);
    // If the iframe hasn't fired load in 4s and is still blank-ish, assume blocked.
    state.loadTimer = setTimeout(() => {
      try {
        const view = $("view");
        // Heuristic: try to read location; if same-origin it works, if cross-origin we can't tell.
        // Fall back to checking if the iframe content area is empty.
        const doc = view.contentDocument || (view.contentWindow && view.contentWindow.document);
        if (!doc || !doc.body || doc.body.innerHTML.trim() === "") {
          showBlocked();
        }
      } catch (e) {
        // Cross-origin — we can't read it. Don't show blocked; assume it loaded.
      }
    }, 4000);
  }

  $("view").addEventListener("load", () => {
    clearTimeout(state.loadTimer);
    hideBlocked();
    setStatus("Done");
  });

  function goBack() {
    const tab = activeTab(); if (!tab) return;
    const h = state.history[tab.id];
    if (!h.back.length) return;
    h.forward.push(tab.url);
    const prev = h.back.pop();
    tab.url = prev;
    $("view").src = prev;
    $("addressBar").value = prev;
    setStatus("Pilot loading " + prev + " …");
    hideBlocked();
    renderTabs();
  }

  function goForward() {
    const tab = activeTab(); if (!tab) return;
    const h = state.history[tab.id];
    if (!h.forward.length) return;
    h.back.push(tab.url);
    const next = h.forward.pop();
    tab.url = next;
    $("view").src = next;
    $("addressBar").value = next;
    setStatus("Pilot loading " + next + " …");
    hideBlocked();
    renderTabs();
  }

  function reload() {
    const tab = activeTab(); if (!tab) return;
    const src = $("view").src;
    hideBlocked();
    armLoadTimer();
    $("view").src = "about:blank";
    setTimeout(() => { $("view").src = src; }, 10);
  }

  function loadActive() {
    const tab = activeTab();
    if (!tab) return;
    hideBlocked();
    armLoadTimer();
    $("view").src = tab.url;
    $("addressBar").value = tab.url;
  }

  function openExternal() {
    const tab = activeTab(); if (!tab) return;
    window.open(tab.url, "_blank", "noopener,noreferrer");
  }

  function renderTabs() {
    const tabsEl = $("tabs");
    [...tabsEl.querySelectorAll(".tab")].forEach(el => el.remove());
    state.tabs.forEach(tab => {
      const el = document.createElement("div");
      el.className = "tab" + (tab.id === state.activeId ? " active" : "");
      el.innerHTML = `<span class="title"></span><button class="close">×</button>`;
      el.querySelector(".title").textContent = tab.title || tab.url;
      el.onclick = (e) => {
        if (!e.target.classList.contains("close")) setActive(tab.id);
      };
      el.querySelector(".close").onclick = (e) => {
        e.stopPropagation(); closeTab(tab.id);
      };
      tabsEl.insertBefore(el, $("newTab"));
    });
  }

  function setStatus(msg) { $("status").textContent = msg; }

  $("newTab").onclick = () => createTab();
  $("back").onclick = goBack;
  $("forward").onclick = goForward;
  $("reload").onclick = reload;
  $("home").onclick = () => navigate(HOME);
  $("openExternal").onclick = openExternal;
  $("openBlocked").onclick = openExternal;
  $("backFromBlocked").onclick = goBack;

  $("addressBar").addEventListener("keydown", (e) => {
    if (e.key === "Enter") navigate(e.target.value);
  });

  document.querySelectorAll("#bookmarks button[data-url]").forEach(btn => {
    btn.onclick = () => navigate(btn.dataset.url);
  });

  $("bookmarkPage").onclick = () => {
    const tab = activeTab(); if (!tab) return;
    try {
      const host = new URL(tab.url).host;
      const btn = document.createElement("button");
      btn.textContent = host;
      btn.dataset.url = tab.url;
      btn.onclick = () => navigate(tab.url);
      $("bookmarks").insertBefore(btn, $("bookmarkPage"));
    } catch {}
  };

  document.addEventListener("keydown", (e) => {
    if (e.target === $("addressBar")) return;
    if (e.ctrlKey || e.metaKey) {
      if (e.key === "t") { e.preventDefault(); createTab(); }
      else if (e.key === "w") { e.preventDefault(); if (state.activeId) closeTab(state.activeId); }
      else if (e.key === "l") { e.preventDefault(); $("addressBar").focus(); $("addressBar").select(); }
      else if (e.key === "r") { e.preventDefault(); reload(); }
    } else if (e.key === "F5") { e.preventDefault(); reload(); }
    else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
    else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); goForward(); }
  });

  createTab();
</script>
</body>
</html>
